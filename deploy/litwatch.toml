# The stack's configuration (docs/specs/v1/data.md, configuration). Anything left out takes its
# default; `litwatch.toml` options are never secrets, which come from `.env`.

[intake]
categories = ["cs.CL", "cs.AI", "cs.LG"]

[schedule]
# The nightly run (intake, classification, analysis, grading, the full-text queue, digests)
# and its workers, and the jobs the owner starts from the app (Process). They call models:
# set the API keys in `.env` first.
enabled = true
# At 02:00 in your zone, so its batches are done by morning (docs/plans/model-spend.md). Set the zone
# to yours (an IANA name).
nightly = "0 2 * * *"
timezone = "UTC"
# Its Anthropic calls go in batches at half price until then; what is left goes as normal calls.
deadline = "07:30"

# The archive is part of the stack: every paper intake stores is registered with it, and it
# serves texts, PDFs and search. Its URL and token come from the compose file.
[integrations.archive]

# The MCP server (LITWATCH_MCP_TOKEN in `.env`) answers only these Host headers; behind a proxy,
# add the name it is reached by. `name:*` allows any port.
# [mcp]
# allowed_hosts = ["litwatch.example.org", "127.0.0.1:*", "localhost:*"]

# Deep cards: start the stack with `--profile deep` and uncomment.
# [integrations.deep]
# url = "http://deep:8081"
