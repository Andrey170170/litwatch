name: Agents and tool use
slug: agents
owner: Andrei
status: active
digest: false
subject: >-
  Language models acting over multiple steps: agent architectures and frameworks, tool and
  function calling, computer and browser use, coding agents, multi-agent systems, planning and
  memory for agents, agent benchmarks and evaluations, and training methods specific to agents.
  Papers that use an off-the-shelf agent only as a baseline for a different topic are tier 3.
rubric: >-
  Tier 1 is rare, about one member in fifty. It requires evidence in the abstract that the field
  will treat the paper as a reference: a new model family or training recipe with released
  weights, a large margin on a widely used benchmark, a method shown to work across several
  domains, or strong evidence overturning a common assumption. Incremental gains, single-domain
  applications, surveys, and position papers are at most tier 2. When in doubt, tier 2.
keywords:
  - agent
  - tool use
  - tool-use
  - function calling
  - computer use
  - multi-agent
  - web navigation
  - SWE-bench
