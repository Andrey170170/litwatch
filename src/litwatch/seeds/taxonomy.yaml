# The seed taxonomy (docs/specs/v1/taxonomy.md): the class tree, then the followed topics in the
# owner's order. A followed class has no description of its own; its topic's subject is it.
classes:
  - slug: language-models
    name: Language models
    children:
      - slug: pretraining
        name: Pretraining, data and scaling
        description: Pretraining objectives and recipes, training data curation, tokenization, scaling laws.
      - slug: preference-training
        name: Instruction tuning and preference training
        description: >-
          Supervised fine-tuning, RLHF, DPO and other preference optimization for general helpfulness.
          Reasoning-specific RL is under Reasoning; safety-motivated alignment is under Alignment and safety.
      - slug: reasoning-and-rl
        name: Reasoning and RL post-training
        children:
          - slug: test-time-compute
            name: Chain-of-thought prompting and test-time compute
            description: Prompting methods, sampling and search at inference, thinking budgets.
          - slug: rl-for-reasoning
            name: Reinforcement learning for reasoning
            description: RL from verifiable rewards, reward models for reasoning, policy optimization methods.
          - slug: reasoning-analyses
            name: Analyses of reasoning models
            description: What reasoning training changes, how reasoning traces behave, length and overthinking.
      - slug: agents
        name: Agents and tool use
        children:
          - slug: coding-agents
            name: Coding and software engineering agents
            description: Repository-level coding, SWE-bench-style tasks, debugging agents.
          - slug: computer-use-agents
            name: Web, GUI and computer-use agents
            description: Browser and desktop control, screen understanding.
          - slug: multi-agent-systems
            name: Multi-agent systems
            description: Several language-model agents interacting, cooperating or debating.
          - slug: agent-evaluation
            name: Agent benchmarks and evaluation
            description: Environments, benchmarks and metrics for agents.
      - slug: efficiency-and-architecture
        name: Efficiency and architecture
        children:
          - slug: architectures
            name: Model architectures
            description: >-
              Transformer variants, state-space and recurrent models, mixture of experts, looped and
              recursive models.
          - slug: long-context
            name: Long context and memory
            description: Context extension, memory mechanisms, context compression.
          - slug: inference-efficiency
            name: Inference efficiency
            description: Quantization, pruning, KV-cache methods, speculative decoding, serving.
          - slug: training-systems
            name: Training efficiency and systems
            description: Distributed training, parallelism, optimizers at scale.
      - slug: retrieval
        name: Retrieval-augmented generation
        description: Retrieval, knowledge bases, grounding and citation for language models.
      - slug: hallucination
        name: Hallucination, calibration and uncertainty
        description: Factuality, truthfulness, confidence estimation, self-consistency.
      - slug: lm-evaluation
        name: Language model evaluation and benchmarks
        description: >-
          General capability benchmarks, evaluation methodology, LLM-as-judge. Safety evaluations are
          under Alignment and safety; agent benchmarks under Agents.
      - slug: multimodal
        name: Multimodal language models
        description: Vision-language and audio-language models, multimodal reasoning.
      - slug: multilingual
        name: Multilingual and low-resource languages
        description: Cross-lingual transfer, languages other than English, low-resource settings.
      - slug: language-tasks
        name: Language tasks and applications
        description: >-
          Machine translation, summarization, information extraction, dialogue, question answering,
          domain applications of language models (law, medicine, education).
  - slug: interpretability
    name: Interpretability
    children:
      - slug: representations
        name: Features and representations
        description: >-
          Probes, representation geometry, linear representations, superposition, neurons and
          directions.
      - slug: sparse-autoencoders
        name: Sparse autoencoders and dictionary learning
        description: SAEs, transcoders, crosscoders, their training and evaluation.
      - slug: circuits
        name: Circuits and causal analysis
      - slug: steering
        name: Steering and model editing
        description: Activation steering, representation engineering, knowledge and behaviour editing.
      - slug: automated-interpretability
        name: Automated interpretability
        description: >-
          Model-written explanations, automated circuit discovery, interpretability agents and tooling.
      - slug: interpretability-evaluation
        name: Interpretability methodology and evaluation
        description: >-
          Benchmarks, ground truth, faithfulness of explanations to the model, best practices.
      - slug: training-dynamics
        name: Training dynamics and mechanisms of learning
        description: >-
          How mechanisms form during training: grokking, phase changes, developmental
