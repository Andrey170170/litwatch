      - slug: cot-faithfulness
        name: Chain-of-thought faithfulness
  - slug: alignment-and-safety
    name: Alignment and safety
    children:
      - slug: safety-training
        name: Safety-motivated alignment training
        description: >-
          Constitutional and value-based training, refusal training, character and honesty training.
      - slug: jailbreaks
        name: Jailbreaks, red-teaming and robustness
        description: >-
          Attacks on safety training, defences, adversarial prompts, red-teaming methods.
      - slug: model-security
        name: Prompt injection and model security
        description: >-
          Prompt injection, data extraction, backdoors and poisoning, agent security.
      - slug: deception
        name: Deception, sandbagging and scheming
        description: >-
          Strategic deception, hidden objectives, sandbagging, evaluation awareness, model organisms
