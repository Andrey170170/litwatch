      - slug: safety-evaluations
        name: Dangerous capabilities and safety evaluations
        description: >-
          Evaluations of harmful capabilities, safety benchmarks, evaluation methodology for safety.
      - slug: cot-monitoring
        name: Chain-of-thought monitoring
