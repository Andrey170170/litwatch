name: Alignment and safety
slug: alignment-and-safety
kind: radar
subject: >-
  Making language models behave as intended and knowing whether they do: preference and constitutional
  training, refusal and jailbreak robustness, reward hacking and specification gaming, deception and
  sandbagging, chain-of-thought and action monitoring, scalable oversight, and evaluation methodology
  and benchmarks for capabilities and safety. Narrow domain benchmarks without a methodological contribution
  are not part of the field.
