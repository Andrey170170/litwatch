name: Efficiency and architecture
slug: efficiency-and-architecture
owner: Andrei
status: active
digest: true
subject: >-
  How language models are built and run: architectures beyond the standard transformer, mixture
  of experts, long-context and memory mechanisms, KV-cache and attention efficiency,
  quantization, pruning, distillation, speculative decoding, and training and inference systems.
  Hardware-specific kernels with no modelling change are tier 3.
rubric: >-
  Tier 1 is rare, about one member in fifty. It requires evidence in the abstract that the field
  will treat the paper as a reference: a new model family or training recipe with released
  weights, a large margin on a widely used benchmark, a method shown to work across several
  domains, or strong evidence overturning a common assumption. Incremental gains, single-domain
  applications, surveys, and position papers are at most tier 2. When in doubt, tier 2.
keywords:
  - mixture of experts
  - MoE
  - long context
  - KV cache
  - quantization
  - speculative decoding
  - state space
  - linear attention
  - distillation
  - memory
