name: Efficiency and architecture
slug: efficiency-and-architecture
kind: pulse
subject: >-
  How language models are built and run: architectures beyond the standard transformer, mixture of
  experts, long-context and memory mechanisms, KV-cache and attention efficiency, quantization, pruning,
  distillation, speculative decoding, and training and inference systems. Hardware-specific kernels
  with no modelling change are not part of the field.
