<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>litwatch · labelling</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f5f1, #17181a); --panel: light-dark(#ffffff, #202225);
    --ink: light-dark(#1d1e20, #e6e4df); --muted: light-dark(#6a6c70, #9a9ca1);
    --line: light-dark(#dedcd5, #33363b); --accent: light-dark(#2d5fb3, #8ab0f2);
    --yes: light-dark(#1e7a46, #62c48b); --no: light-dark(#a33a34, #e58a84);
    --unsure: light-dark(#8a6a12, #d9b75a);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
         flex-wrap: wrap; }
  select, button { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 8px; max-width: 100%; }
  .progress { color: var(--muted); font-size: 14px; margin-left: auto; white-space: nowrap; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 120px; }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 20px 22px; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .meta a { color: var(--accent); }
  .abstract { font-size: 16px; white-space: pre-wrap; }
  .topic { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .topic h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline;
              flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line);
         border-radius: 999px; padding: 1px 8px; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .choices button { flex: 1 1 110px; min-height: 44px; border-radius: 10px; cursor: pointer;
                    background: transparent; border: 1px solid var(--line); padding: 6px 10px; }
  .choices button kbd { font: 12px ui-monospace, monospace; color: var(--muted);
                        margin-left: 6px; }
  .choices button[aria-pressed="true"] { color: var(--bg); border-color: transparent; }
  .choices button[data-v="relevant"][aria-pressed="true"] { background: var(--yes); }
  .choices button[data-v="not_relevant"][aria-pressed="true"] { background: var(--no); }
  .choices button[data-v="unsure"][aria-pressed="true"] { background: var(--unsure); }
  .choices button[aria-pressed="true"] kbd { color: inherit; opacity: .8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent);
                                              outline-offset: 2px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
           border-top: 1px solid var(--line); padding: 10px 16px; }
  .nav { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  .nav button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
                background: var(--panel); padding: 6px 14px; cursor: pointer; }
  .nav .all { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; max-width: 820px; margin: 14px auto 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (hover: none) { kbd, .hint { display: none; } }
</style>
</head>
<body>
<header><div class="bar">
  <label for="set" hidden>Queue</label>
  <select id="set"></select>
  <label><input type="checkbox" id="todo" checked> unlabelled only</label>
  <span class="progress" id="progress" aria-live="polite"></span>
</div></header>
<main id="main"><p class="empty">Loading…</p></main>
<footer><div class="nav">
  <button id="prev" aria-label="Previous paper">← <kbd>k</kbd></button>
  <button id="none" class="all">Not relevant to any, next <kbd>n</kbd></button>
  <button id="next" aria-label="Next paper"><kbd>j</kbd> →</button>
</div></footer>
<script>
const KEYS = [["1", "2", "3"], ["q", "w", "e"], ["a", "s", "d"]];
const VALUES = [["relevant", "Relevant"], ["not_relevant", "Not relevant"], ["unsure", "Unsure"]];
const state = { topics: [], sets: [], key: null, items: [], at: 0 };
const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const response = await fetch(path, { credentials: "same-origin", ...options });
  if (response.status === 401) {
    $("main").innerHTML = '<p class="empty">Open this page once with <code>?token=…</code>.</p>';
    throw new Error("unauthorised");
  }
  if (!response.ok) throw new Error(await response.text());
  return response.status === 204 ? null : response.json();
}

function finished(item) {
  return state.topics.every((t) => item.labels[t.slug] && !item.labels[t.slug].provisional);
}

function visible() {
  return $("todo").checked ? state.items.filter((i) => !finished(i) || i.keep) : state.items;
}

function escape(text) {
  const span = document.createElement("span");
  span.textContent = text ?? "";
  return span.innerHTML;
}

function render() {
  const list = visible();
  const done = state.items.filter(finished).length;
  $("progress").textContent = `${done} of ${state.items.length} done`;
  if (!list.length) {
    $("main").innerHTML = '<p class="empty">Nothing left in this queue.</p>';
    return;
  }
  state.at = Math.max(0, Math.min(state.at, list.length - 1));
  const item = list[state.at];
  const year = item.published ? item.published.slice(0, 10) : "";
  const topics = state.topics.map((topic, row) => {
    const label = item.labels[topic.slug];
    const tags = [];
    if (label && label.provisional) tags.push("accepted in bulk");
    if (label && label.grade) tags.push(label.grade.replace("_", " "));
    const buttons = VALUES.map(([value, text], column) => {
      const pressed = label && !label.provisional && label.value === value;
      return `<button data-topic="${topic.slug}" data-v="${value}" aria-pressed="${!!pressed}">
        ${text}<kbd>${KEYS[row] ? KEYS[row][column] : ""}</kbd></button>`;
    }).join("");
    return `<section class="topic">
      <h2>${escape(topic.name)} ${tags.map((t) => `<span class="tag">${t}</span>`).join("")}</h2>
      ${label && label.note ? `<p class="note">${escape(label.note)}</p>` : ""}
      <div class="choices" role="group" aria-label="${escape(topic.name)}">${buttons}</div>
    </section>`;
  }).join("");
  $("main").innerHTML = `<article>
    <h1>${escape(item.title)}</h1>
    <div class="meta">${state.at + 1} / ${list.length} ·
      <a href="https://arxiv.org/abs/${item.id}" target="_blank" rel="noopener">${item.id}</a>
      · ${year} · ${escape((item.categories || []).join(", "))}
      ${item.stratum ? `· ${item.stratum === "near" ? "in a Radar field" : "outside the Radar fields"}` : ""}
      <br>${escape((item.authors || []).slice(0, 6).join(", "))}${(item.authors || []).length > 6 ? " et al." : ""}
    </div>
    <div class="abstract">${escape(item.abstract)}</div>
    ${topics}
  </article>
  <p class="hint">Keys: ${state.topics.map((t, i) => KEYS[i] ? `${KEYS[i].join(" ")} for ${escape(t.name)}` : "").join(" · ")}
    (relevant, not relevant, unsure) · n marks every topic not relevant and moves on · j and k move.</p>`;
  window.scrollTo(0, 0);
}

async function setLabel(item, slug, value) {
  const current = item.labels[slug];
  item.keep = true;  // stays on screen until the reader moves on
  if (current && !current.provisional && current.value === value) {
    await api(`/api/labels/${item.id}/${slug}`, { method: "DELETE" });
    delete item.labels[slug];
  } else {
    item.labels[slug] = await api(`/api/labels/${item.id}/${slug}`, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ value, queue: state.key, grade: current ? current.grade : null,
                             note: current ? current.note : null }),
    });
  }
  render();
}

function move(step) {
  const list = visible();
  const item = list[state.at];
  if (item) item.keep = false;
  // A finished paper leaves the unlabelled view, so the next one slides into its place.
  const stays = visible().includes(item);
  state.at += step > 0 && !stays ? 0 : step;
  render();
}

async function noneAndNext() {
  const item = visible()[state.at];
  if (!item) return;
  for (const topic of state.topics) {
    const label = item.labels[topic.slug];
    if (!label || label.provisional || label.value !== "not_relevant") {
      item.labels[topic.slug] = await api(`/api/labels/${item.id}/${topic.slug}`, {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ value: "not_relevant", queue: state.key }),
      });
    }
  }
  move(1);
}

async function load(key) {
  state.key = key;
  state.items = await api(`/api/labelling/${key}`);
  state.at = 0;
  render();
}

$("main").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-topic]");
  if (button) setLabel(visible()[state.at], button.dataset.topic, button.dataset.v);
});
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("none").onclick = noneAndNext;
$("set").onchange = (event) => load(event.target.value);
$("todo").onchange = () => { state.at = 0; render(); };
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.target.tagName === "SELECT") return;
  const key = event.key.toLowerCase();
  if (key === "j") return move(1);
  if (key === "k") return move(-1);
  if (key === "n") return noneAndNext();
  KEYS.forEach((row, index) => {
    const column = row.indexOf(key);
    const item = visible()[state.at];
    if (column >= 0 && state.topics[index] && item) {
      setLabel(item, state.topics[index].slug, VALUES[column][0]);
    }
  });
});

(async () => {
  const info = await api("/api/labelling");
  state.topics = info.topics;
  state.sets = info.sets;
  $("set").innerHTML = info.sets
    .map((s) => `<option value="${s.key}">${escape(s.name)} (${s.total})</option>`).join("");
  const first = info.sets.find((s) => s.total > 0) || info.sets[0];
  $("set").value = first.key;
  await load(first.key);
})();
</script>
</body>
</html>
