[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litwatch"
version = "1.0.0.dev0"
description = "Insurance against missing a paper on a watched research question"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "arxiv-archive==0.2.0",
    "arxiv>=2.1",
    "requests>=2.32",
    "urllib3>=2.0",
    "anthropic>=1.12.1",
    "fastapi>=0.142",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "uvicorn>=0.30",
    "croniter>=6.2.4",
    "lxml>=6.1.3",
    "pypdfium2>=4.30",
    "mcp>=2.3.0,<3",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
pdf = [
    "pymupdf4llm>=1.28.2",
]

[project.scripts]
litwatch = "litwatch.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# The role rules (docs/specs/architecture.md, "Roles"), by package: `core` is Records and
# Policies, `store` Repositories, `llm` the Model gate, `api` and `cli` Entries, and every other
# package a Service. `config`, `logs`, `concurrency` and `writing` are shared modules: they import
# only `core`, and any role but `core` and `store` may import them. `tests/test_roles.py` keeps the lists below in step with the
# packages, and checks that Services form no cycle. `ignore_imports` lists today's violations: it
# only shrinks, and an entry that no longer matches an import fails the check.
[tool.importlinter]
root_package = "litwatch"

[[tool.importlinter.contracts]]
name = "core imports nothing of litwatch outside core"
type = "forbidden"
source_modules = ["litwatch.core"]
forbidden_modules = ["litwatch.*"]

[[tool.importlinter.contracts]]
name = "store imports only core and itself"
type = "forbidden"
source_modules = ["litwatch.store"]
forbidden_modules = [
    "litwatch.analysis",
    "litwatch.api",
    "litwatch.archive",
    "litwatch.classification",
    "litwatch.cli",
    "litwatch.concurrency",
    "litwatch.config",
    "litwatch.digests",
    "litwatch.events",
    "litwatch.feedback",
    "litwatch.fulltext",
    "litwatch.grading",
    "litwatch.intake",
    "litwatch.integrations",
    "litwatch.jobs",
    "litwatch.llm",
    "litwatch.logs",
    "litwatch.publications",
    "litwatch.quality",
    "litwatch.seeds",
    "litwatch.writing",
]
ignore_imports = [
    "litwatch.store.calls -> litwatch.llm.types",
    "litwatch.store.digests -> litwatch.events",
    "litwatch.store.papers -> litwatch.events",
]

[[tool.importlinter.contracts]]
name = "a gate (llm) imports no Service and no Entry"
type = "forbidden"
source_modules = ["litwatch.llm"]
forbidden_modules = [
    "litwatch.analysis",
    "litwatch.api",
    "litwatch.archive",
    "litwatch.classification",
    "litwatch.cli",
    "litwatch.digests",
    "litwatch.events",
    "litwatch.feedback",
    "litwatch.fulltext",
    "litwatch.grading",
    "litwatch.intake",
    "litwatch.integrations",
    "litwatch.jobs",
    "litwatch.publications",
    "litwatch.quality",
    "litwatch.seeds",
]

[[tool.importlinter.contracts]]
name = "shared modules import only core"
type = "forbidden"
source_modules = ["litwatch.concurrency", "litwatch.config", "litwatch.logs", "litwatch.writing"]
forbidden_modules = [
    "litwatch.analysis",
    "litwatch.api",
    "litwatch.archive",
    "litwatch.classification",
    "litwatch.cli",
    "litwatch.digests",
    "litwatch.events",
    "litwatch.feedback",
    "litwatch.fulltext",
    "litwatch.grading",
    "litwatch.intake",
    "litwatch.integrations",
    "litwatch.jobs",
    "litwatch.llm",
    "litwatch.publications",
    "litwatch.quality",
    "litwatch.seeds",
    "litwatch.store",
]

[[tool.importlinter.contracts]]
name = "nothing imports an Entry, but cli may import api"
type = "protected"
protected_modules = ["litwatch.api", "litwatch.cli"]
allowed_importers = ["litwatch.cli"]

[tool.hatch.build.targets.wheel]
packages = ["src/litwatch"]
# The built web app is not in git but ships in the package.
artifacts = ["src/litwatch/api/web/**"]

[tool.uv.sources]
arxiv-archive = { path = "vendor/arxiv_archive-0.2.0-py3-none-any.whl" }
