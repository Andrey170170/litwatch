[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litwatch"
version = "1.0.0.dev0"
description = "Insurance against missing a paper on a watched research question"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "arxiv-archive==0.2.0",
    "arxiv>=2.1",
    "requests>=2.32",
    "urllib3>=2.0",
    "anthropic>=1.12.1",
    "fastapi>=0.142",
    "httpx>=0.27",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "uvicorn>=0.30",
    "croniter>=6.2.4",
    "lxml>=6.1.3",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
pdf = [
    "pymupdf4llm>=1.28.2",
]

[project.scripts]
litwatch = "litwatch.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/litwatch"]
# The built web app is not in git but ships in the package.
artifacts = ["src/litwatch/api/web/**"]

[tool.uv.sources]
arxiv-archive = { path = "vendor/arxiv_archive-0.2.0-py3-none-any.whl" }
