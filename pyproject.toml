[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litwatch"
version = "0.4.1"
description = "Literature watch for CoT monitoring and faithfulness papers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
litwatch = "litwatch.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/litwatch"]
