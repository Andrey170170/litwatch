- id: '2603.20508'
  title: Measuring Weak-to-Strong Legibility of Reasoning Models
  abstract: Reasoning language models (RLMs) and the intermediate chains of thought they emit play an
    increasingly central role in multi-agent setups such as inter-model monitoring or distillation into
    smaller models. When agents at different capability tiers must cooperate, strong models need to produce
    traces digestible by weaker ones. We refer to this goal as "weak-to-strong legibility". Trustworthiness
    of large models depends in part on this legibility property. For safety oversight in particular, adoption
    of weak monitors may become a standard for reliability scaffolds on a healthy budget. Legibility requires
    that the shape of these decision-making traces takes some form accessible to weaker monitors. Existing
    efficiency-based metrics for legibility fail to capture "thoroughness", instead focusing on conciseness.
