- id: '2510.13272'
  title: 'Beyond Correctness: Rewarding Faithful Reasoning in Retrieval-Augmented Generation'
  abstract: 'Inspired by the success of reinforcement learning (RL) in Large Language Model (LLM) training
    for domains like math and code, recent work has begun training LLMs to dynamically plan, query, and
    reason with search engines as tools -- a paradigm increasingly referred to as agentic search. Although
    these methods achieve performance improvement across popular short-form QA benchmarks, many prioritize
    final answer correctness while overlooking the quality of intermediate reasoning steps, which may
    lead to chain-of-thought unfaithfulness. In this paper, we first introduce a comprehensive evaluation
    framework for agentic search, covering three distinct faithfulness metrics: Think-Search faithfulness,
    Information-Think faithfulness, and Think-Answer faithfulness. Our evaluations reveal that canonical
    agentic search systems trained through Reinforcement Learning from Verifiable Reward (RLVR) using
    episode-level outcome-based reward -- including Search-R1 and ReSearch -- have significant room for
    improvement on these faithfulness dimensions. To foster faithful reasoning in agentic search, we introduce
    VERITAS (Verifying Entailed Reasoning through Intermediate Traceability in Agentic Search), a novel
    framework that integrates fine-grained turn-level faithfulness rewards into the reinforcement learning
    process. Our experiments show that models trained with \ours not only significantly improve reasoning
    faithfulness, but also achieve better task performance compared to baselines trained against episode-level
    outcome-based reward.'
