- id: '1903.05297'
  title: Learning Symmetric and Asymmetric Steganography via Adversarial Training
  abstract: Steganography refers to the art of concealing secret messages within multiple media carriers
    so that an eavesdropper is unable to detect the presence and content of the hidden messages. In this
    paper, we firstly propose a novel key-dependent steganographic scheme that achieves steganographic
    objectives with adversarial training. Symmetric (secret-key) and Asymmetric (public-key) steganographic
    scheme are separately proposed and each scheme is successfully designed and implemented. We show that
    these encodings produced by our scheme improve the invisibility by 20% than previous deep-leanring-based
    work, and further that perform competitively remarkable undetectability 25% better than classic steganographic
    algorithms. Finally, we simulated our scheme in a real situation where the decoder achieved an accuracy
    of more than 98% of the original message.
