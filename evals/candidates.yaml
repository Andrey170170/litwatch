- id: '2605.00199'
  title: 'RSAT: Structured Attribution Makes Small Language Models Faithful Table Reasoners'
  abstract: 'When a language model answers a table question, users have no way to verify which cells informed
    which reasoning steps. We introduce RSAT, a method that trains small language models (SLMs, 1-8B)
    to produce step-by-step reasoning with cell-level citations grounded in table evidence. Phase 1 (SFT)
    teaches a structured JSON output format from verified reasoning traces. Phase 2 (GRPO) optimizes a
    composite reward centered on NLI-based faithfulness, alongside citation validity and parsimony. Across
    six models from two families-Qwen 2.5 (1.5B/3B/7B) and Llama 3 (1B/3B/8B)-RSAT improves faithfulness
    3.7$\times$ over SFT alone (0.224$\rightarrow$0.826), with near-perfect citation validity (0.992).
    Post-hoc attribution collapses below 13% format success, confirming that attribution must be integrated
    into reasoning, not retrofitted. Ablations show the faithfulness reward is essential: removing it
    drops faithfulness from 0.97 to 0.03.'
