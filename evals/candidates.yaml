    mech_interp: false
  note: 'draft (openai/gpt-5.6-luna, high): The paper directly evaluates CoT faithfulness and unfaithful
    or unarticulated bias cues in vision-language and language models, using behavioral reasoning-trace
    analysis without model-internal methods.'
- id: '2506.01926'
  title: Large language models can learn and generalize steganographic chain-of-thought under process
    supervision
  abstract: 'Chain-of-thought (CoT) reasoning not only enhances large language model performance but also
    provides critical insights into decision-making processes, marking it as a useful tool for monitoring
    model intent and planning. However, recent works have shown that banning the mention of a specific
    example of reward hacking causes obfuscation of the undesired reasoning traces but the persistence
    of the undesired behavior, threatening the reliability of CoT monitoring. We provide an extension
    to these results with regard to the ability of models to learn a specific type of obfuscated reasoning:
    steganography. First, we show that penalizing the use of specific strings within load-bearing reasoning
    traces causes models to substitute alternative strings. Crucially, this does not alter the underlying
    method by which the model performs the task, demonstrating that the model can learn to steganographically
    encode its reasoning.We further demonstrate that models can generalize an encoding scheme. When the
    penalized strings belong to an overarching class, the model learns not only to substitute strings
    seen in training, but also develops a general encoding scheme for all members of the class which it
    can apply to held-out testing strings.'
