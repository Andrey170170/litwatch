- id: '1904.12162'
  title: Sentiment Classification using N-gram IDF and Automated Machine Learning
  abstract: We propose a sentiment classification method with a general machine learning framework. For
    feature representation, n-gram IDF is used to extract software-engineering-related, dataset-specific,
    positive, neutral, and negative n-gram expressions. For classifiers, an automated machine learning
    tool is used. In the comparison using publicly available datasets, our method achieved the highest
    F1 values in positive and negative sentences on all datasets.
