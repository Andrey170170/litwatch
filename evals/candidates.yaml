- id: '2508.17320'
  title: 'AdaptiveK: Complexity-Driven Sparse Autoencoders for Interpretable Language Model Representations'
  abstract: 'Understanding the internal representations of large language models (LLMs) remains a central
    challenge for interpretability research. Sparse autoencoders (SAEs) offer a promising solution by
    decomposing activations into interpretable features, but existing approaches rely on fixed sparsity
    constraints that fail to account for input complexity. We propose AdaptiveK SAE (Adaptive Top K Sparse
    Autoencoders), a novel framework that dynamically adjusts sparsity levels based on the semantic complexity
    of each input. Leveraging linear probes, we demonstrate that context complexity is linearly encoded
    in LLM representations, and we use this signal to guide feature allocation during training. Experiments
    across ten language models demonstrate that this complexity-driven adaptation outperforms fixed-sparsity
    approaches on reconstruction fidelity, explained variance, cosine similarity and interpretability
    metrics while eliminating the burden of extensive hyperparameter tuning. Our code is available at:
    https://github.com/hiyukie/adaptiveK.'
