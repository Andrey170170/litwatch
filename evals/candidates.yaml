papers:
- id: '2502.05242'
  title: 'Beyond External Monitors: Enhancing Transparency of Large Language Models for Easier Monitoring'
  abstract: Large language models (LLMs) are becoming increasingly capable, but the mechanisms of their
    thinking and decision-making processes remain unclear. Chain-of-thoughts (CoTs) have been commonly
    utilized to externalize LLMs' thinking, but this strategy fails to accurately reflect LLMs' thinking
    process. Techniques based on LLMs' hidden representations provide an inner perspective to improve
    the monitorability of their latent thinking. However, previous methods only try to develop external
    modules instead of making LLMs themselves easier to monitor. In this paper, we propose a novel method,
    TELLME, improving the transparency of LLMs and helping monitors identify unsuitable and sensitive
    behaviors. Furthermore, we showcase the effectiveness of TELLME on detoxification tasks, where LLMs
    achieve consistent improvement among multimodal test sets, distinct architectures, and varying parameter
    scales. We further analyze TELLME's improvement on LLMs' generalization ability from both optimal
    transport theory and empirical perspectives.
  authors:
