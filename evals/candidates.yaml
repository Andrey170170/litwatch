- id: '2602.16154'
  title: Balancing Faithfulness and Performance in Reasoning via Multi-Listener Soft Execution
  abstract: Chain-of-thought (CoT) reasoning sometimes fails to faithfully reflect the true computation
    of a large language model (LLM), hampering its utility in explaining how LLMs arrive at their answers.
    Moreover, optimizing for faithfulness and interpretability in reasoning often degrades task performance.
    To address this tradeoff and improve CoT faithfulness, we propose Reasoning Execution by Multiple
    Listeners (REMUL), a multi-party reinforcement learning approach. REMUL builds on the hypothesis that
    reasoning traces which other parties can follow will be more faithful. A speaker model generates a
    reasoning trace, which is truncated and passed to a pool of listener models who "execute" the trace,
    continuing the trace to an answer. Speakers are rewarded for producing reasoning that is clear to
    listeners, with additional correctness regularization via masked supervised finetuning to counter
    the tradeoff between faithfulness and performance. On multiple reasoning benchmarks (BIG-Bench Extra
    Hard, MuSR, ZebraLogicBench, and FOLIO), REMUL consistently and substantially improves three measures
    of faithfulness -- hint attribution, early answering area over the curve (AOC), and mistake injection
    AOC -- while also improving accuracy. Our analysis finds that these gains are robust across training
    domains, translate to legibility gains, and are associated with shorter and more direct CoTs.
