- id: '2105.09043'
  title: Sentence Extraction-Based Machine Reading Comprehension for Vietnamese
  abstract: The development of natural language processing (NLP) in general and machine reading comprehension
    in particular has attracted the great attention of the research community. In recent years, there
    are a few datasets for machine reading comprehension tasks in Vietnamese with large sizes, such as
    UIT-ViQuAD and UIT-ViNewsQA. However, the datasets are not diverse in answers to serve the research.
    In this paper, we introduce UIT-ViWikiQA, the first dataset for evaluating sentence extraction-based
    machine reading comprehension in the Vietnamese language. The UIT-ViWikiQA dataset is converted from
    the UIT-ViQuAD dataset, consisting of comprises 23.074 question-answers based on 5.109 passages of
    174 Wikipedia Vietnamese articles. We propose a conversion algorithm to create the dataset for sentence
    extraction-based machine reading comprehension and three types of approaches for sentence extraction-based
    machine reading comprehension in Vietnamese. Our experiments show that the best machine model is XLM-R_Large,
    which achieves an exact match (EM) of 85.97% and an F1-score of 88.77% on our dataset. Besides, we
    analyze experimental results in terms of the question type in Vietnamese and the effect of context
    on the performance of the MRC models, thereby showing the challenges from the UIT-ViWikiQA dataset
    that we propose to the language processing community.
