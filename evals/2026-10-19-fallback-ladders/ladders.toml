# The fallback replay's ladders (docs/plans/failure-handling.md, P1): per role that writes, its
# own model first, then the plan's starting list, then the other candidates the plan names.
# `litwatch eval ladders` asks each candidate alone. Prices are USD per million input and output
# tokens: Anthropic's from `llm/prices.py`, the rest from OpenRouter's catalogue on 2026-10-19;
# they only size the estimate and each call's reservation, and every recorded cost is the
# provider's own. `output_tokens` is about a call's mean in production's journal (a reasoning
# candidate's own thinking is not known before the run); `reserve_output_tokens` bounds a call.
# A candidate's effort is its role's own model's, where the model takes one.

[judge]
output_tokens = 600
reserve_output_tokens = 8000

[[judge.candidates]]
name = "opus"
price = [4.0, 20.0]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

