# The fallback replay's ladders (docs/plans/failure-handling.md, P1): per role that writes, its
# own model first, then the plan's starting list, then the other candidates the plan names
# (for `field_grade`, four more, added after the first run: its candidates fell well below Haiku).
# `litwatch eval ladders` asks each candidate alone. Prices are USD per million input and output
# tokens. `price` sizes the estimate: Anthropic's from `llm/prices.py`, the rest OpenRouter's
# catalogue price on 2026-10-19 (its cheapest endpoint). `price_max` and `max_output` size each
# call's reservation: Anthropic's price with a cache write's 1.25 on input, and the cap the
# pipeline sends; for the rest, the dearest endpoint and the largest `max_completion_tokens` in
# OpenRouter's endpoint list on 2026-10-19, among the endpoints the candidate's routing allows
# (its calls go out uncapped, as the pipeline's do). Every recorded cost is the provider's own.
# `output_tokens` is about a call's mean in production's journal (a reasoning candidate's own
# thinking is not known before the run). A candidate's effort is its role's own model's, where
# the model takes one.

[judge]
output_tokens = 600

