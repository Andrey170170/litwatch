# The fallback replay's ladders (docs/plans/failure-handling.md, P1): per role that writes, its
# own model first, then the plan's starting list, then the other candidates the plan names.
# `litwatch eval ladders` asks each candidate alone. Prices are USD per million input and output
# tokens. `price` sizes the estimate: Anthropic's from `llm/prices.py`, the rest OpenRouter's
# catalogue price on 2026-10-19 (its cheapest endpoint). `price_max` sizes each call's
# reservation: Anthropic's with a cache write's 1.25 on input, the rest the dearest endpoint in
# OpenRouter's endpoint list on 2026-10-19 among those the candidate's routing allows. Every
# recorded cost is the provider's own. `output_tokens` is about a call's mean in production's
# journal (a reasoning candidate's own thinking is not known before the run);
# `reserve_output_tokens` is an OpenRouter call's output cap, sent with it and held by its
# reservation; the pipeline sends these calls uncapped, and the cap is above every output the
# run's calls made (6,713 at most, `field_grade`'s DeepSeek V4.1 Flash).
# A candidate's effort is its role's own model's, where the model takes one.

[judge]
output_tokens = 600
reserve_output_tokens = 8000

